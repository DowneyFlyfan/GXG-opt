experiment_name: gpt2_v2_5070ti_muon_lr003_screen
comparison_profile: optimizer_v2_local_muon_lr_screen
hardware:
  gpu: NVIDIA GeForce RTX 5070 Ti
  minimum_gpu_memory_gib: 16
model:
  name: openai-community/gpt2
  local_path: .cache/gpt2-v2/gpt2-model
  initialization: random
  sequence_length: 512
dataset:
  name: Salesforce/wikitext
  config: wikitext-103-raw-v1
  local_path: .cache/gpt2-v2/wikitext103-gpt2-512
training:
  epochs: 5
  seeds: [0]
  batch_size: 4
  gradient_accumulation_steps: 8
  evaluation_batch_size: 4
  evaluation_interval: 16
  checkpoint_interval: 16
  warmup_fraction: 0.06
  gradient_clip_norm: 1.0
  precision: bfloat16
  tf32: true
  probe_sequence_length: 128
baseline:
  lr: 3.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  momentum: 0.95
methods:
  - id: adamw
    label: AdamW baseline
    role: baseline
  - id: muon
    label: PyTorch Muon baseline
    role: baseline
  - id: qk_defect_v1
    label: Query-key finite-interaction correction
    role: proposal
    optimizer_config: configs/optimizer/2.0/01_qk_defect.yaml
  - id: routing_resistance_v1
    label: Sparse attention-curvature preconditioning
    role: proposal
    optimizer_config: configs/optimizer/2.0/02_routing_resistance.yaml
  - id: tied_path_curvature_v1
    label: Tied embedding joint curvature
    role: proposal
    optimizer_config: configs/optimizer/2.0/03_tied_path_curvature.yaml
  - id: proposal_notch_v1
    label: Resonance-selective proposal filtering
    role: proposal
    optimizer_config: configs/optimizer/2.0/04_proposal_notch.yaml
  - id: feature_remap_cohort_v1
    label: Feature-drift cohort momentum remapping
    role: proposal
    optimizer_config: configs/optimizer/2.0/05_feature_remap.yaml
  - id: ln_response_v1
    label: LayerNorm finite-response coupling
    role: proposal
    optimizer_config: configs/optimizer/2.0/06_ln_response.yaml
