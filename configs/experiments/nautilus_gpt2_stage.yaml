apiVersion: v1
kind: Pod
metadata:
  name: nautilus-gpt2-stage
  labels:
    app: new-optimizer-gpt2
    purpose: stage-formal-ppl-data
spec:
  restartPolicy: Never
  containers:
    - name: stage
      image: nvcr.io/nvidia/pytorch:26.04-py3
      command: ["bash", "-lc"]
      args: ["sleep 7200"]
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "2"
          memory: 8Gi
      volumeMounts:
        - name: results
          mountPath: /workspace
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: new-optimizer-gpt2-results
